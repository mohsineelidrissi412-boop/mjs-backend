<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Admin</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
        }
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-light);
            box-shadow: var(--shadow-sm);
        }
        .profile-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .info-group {
            display: flex;
            flex-direction: column;
        }
        .info-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 500;
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div style="width:40px; height:40px; background:var(--primary-color); border-radius:8px;"></div>
            <h2>AdminPanel</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> Vue d'ensemble
            </a>
            <a href="users.html" class="nav-item active">
                <i class="fas fa-user"></i> Mon Profil
            </a>
            <a href="news.html" class="nav-item">
                <i class="fas fa-newspaper"></i> Publications
            </a>
            <a href="clubs.html" class="nav-item">
                <i class="fas fa-users"></i> Gestion des Clubs
            </a>
            <a href="events.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i> Événements
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i> Paramètres
            </a>
        </nav>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        
        <!-- TOPBAR -->
        <header class="topbar">
            <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
            <h1 class="topbar-title">Mon Profil</h1>
            
            <div class="topbar-actions">
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=4F46E5&color=fff" alt="Admin Avatar">
                    <div class="user-info">
                        <p class="name">Admin User</p>
                        <p class="role">Administrateur</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="content-area">
            
            <div class="card">
                <div class="profile-header">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=4F46E5&color=fff&size=200" alt="Avatar large" class="profile-avatar-large">
                    <div>
                        <h2 style="margin:0 0 10px 0; font-size:24px;">Admin User</h2>
                        <span class="badge badge-primary">Administrateur Principal</span>
                        <div style="margin-top:15px;">
                            <button class="btn btn-secondary"><i class="fas fa-camera"></i> Changer la photo</button>
                        </div>
                    </div>
                </div>

                <hr style="border:none; border-top:1px solid #E2E8F0; margin:24px 0;">

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="margin:0;">Informations Personnelles</h3>
                    <button class="btn btn-primary"><i class="fas fa-edit"></i> Modifier les informations</button>
                </div>

                <div class="profile-info-grid">
                    <div class="info-group">
                        <span class="info-label">Nom</span>
                        <span class="info-value" id="profile-lastname">...</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Prénom</span>
                        <span class="info-value" id="profile-firstname">...</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Téléphone</span>
                        <span class="info-value" id="profile-phone">...</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Email</span>
                        <span class="info-value" id="profile-email">...</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Rôle</span>
                        <span class="info-value" id="profile-role">...</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">Statut</span>
                        <span class="info-value" id="profile-status">...</span>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = window.api.getUser();
            if (!user || user.role !== 'ADMIN') {
                window.location.href = "../public/login.html";
                return;
            }

            document.getElementById("profile-firstname").textContent = user.first_name || '-';
            document.getElementById("profile-lastname").textContent = user.last_name || '-';
            document.getElementById("profile-email").textContent = user.email || '-';
            document.getElementById("profile-phone").textContent = user.phone || '-';
            document.getElementById("profile-role").textContent = user.role || '-';
            document.getElementById("profile-status").textContent = user.status || '-';
            
            // Topbar
            const topNames = document.querySelectorAll(".name");
            topNames.forEach(el => el.textContent = `${user.first_name} ${user.last_name}`);
            
            const bigName = document.querySelector(".profile-header h2");
            if (bigName) bigName.textContent = `${user.first_name} ${user.last_name}`;
        });
    </script>
</body>
</html>

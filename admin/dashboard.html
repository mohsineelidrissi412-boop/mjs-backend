<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Plateforme de Gestion</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div style="width:40px; height:40px; background:var(--primary-color); border-radius:8px;"></div>
            <h2>AdminPanel</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <i class="fas fa-home"></i> Vue d'ensemble
            </a>
            <a href="users.html" class="nav-item">
                <i class="fas fa-user"></i> Mon Profil
            </a>
            <a href="news.html" class="nav-item">
                <i class="fas fa-newspaper"></i> Publications
            </a>
            <a href="clubs.html" class="nav-item">
                <i class="fas fa-users"></i> Gestion des Clubs
            </a>
            <a href="events.html" class="nav-item">
                <i class="fas fa-calendar-alt"></i> Événements
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i> Paramètres
            </a>
            <a href="#" class="nav-item text-danger" onclick="window.api.logout(); return false;">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </nav>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        
        <!-- TOPBAR -->
        <header class="topbar">
            <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
            <h1 class="topbar-title">Vue d'ensemble</h1>
            
            <div class="topbar-actions">
                <div class="user-profile">
                    <img id="user-avatar" src="https://ui-avatars.com/api/?name=Admin&background=4F46E5&color=fff" alt="Avatar">
                    <div class="user-info">
                        <p class="name" id="user-name">Chargement...</p>
                        <p class="role" id="user-role">...</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="content-area">
            
            <!-- Statistiques / Analytics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-members">...</h3>
                        <p>Total des membres</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-user-clock"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-pending">...</h3>
                        <p>Utilisateurs en attente</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-events">...</h3>
                        <p>Événements ce mois</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-clubs">...</h3>
                        <p>Clubs actifs</p>
                    </div>
                </div>
            </div>

            <!-- Dashboard Actions -->
            <div class="card" style="margin-top: 24px;">
                <h2>Actions Rapides</h2>
                <div style="display: flex; gap: 15px; margin-top: 15px;">
                    <a href="users.html" class="submit-btn" style="text-decoration: none; display: inline-block;">Gérer les utilisateurs</a>
                    <a href="clubs.html" class="submit-btn" style="text-decoration: none; display: inline-block; background: #64748b;">Gérer les clubs</a>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Scripts API -->
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>

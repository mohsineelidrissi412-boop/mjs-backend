<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    
  
<nav class="navbar">

    <div class="logo-section">

        <img src="../images/logo.png"
             alt="Logo"
             class="logo">

        <div class="logo-text">

            <span class="title">
                Maison des Jeunes Alqods
            </span>

            <span class="subtitle">
                Benguerir
            </span>

        </div>

    </div>

    <div class="nav-links">

        <a href="index.html">
            Accueil
        </a>

        <a href="news.html"
           class="active">
            Actualités
        </a>

        <a href="events.html">
            Événements
        </a>

        <a href="clubs.html">
            Clubs
        </a>

        <a href="pass-jeunes.html">
            Pass Jeunes
        </a>

        <a href="register.html" class="join-btn">
            Nous rejoindre
        </a>

    </div>

</nav>

<main class="news-page">

    

    <section id="news-list">

        <div class="news-card">

            <img src="../images/news/news1.jpg" alt="">

            <div class="news-content">

                <h3>
                    Titre Actualité
                </h3>

                <p>
                    Résumé de l'actualité sur 2 ou 3 lignes...
                </p>

                <button class="read-more">
                    Lire la suite →
                </button>

                <span class="date">
                    22 Juin 2026
                </span>

            </div>

        </div>

    </section>

    <!-- DÉTAIL DE L'ACTUALITÉ -->

    <section id="news-detail">

        <button id="back-btn">
            ← Retour aux actualités
        </button>

        <h1 id="detail-title">
            Titre Actualité
        </h1>

        <!-- SLIDER -->

        <div class="news-slider">

            <div class="slides">

                <img src="../images/news/1.jpg"
                     class="slide active">

                <img src="../images/news/2.jpg"
                     class="slide">

                <img src="../images/news/3.jpg"
                     class="slide">

            </div>

            <button class="prev">
                &#10094;
            </button>

            <button class="next">
                &#10095;
            </button>

            <div class="dots"></div>

        </div>

        <!-- TEXTE -->

        <div class="detail-content">

            <p>
                Texte complet de l'actualité...
            </p>

        </div>

        <!-- ACTIONS -->

        <div class="news-actions">

            <button>
                ❤️ J'aime
            </button>

        </div>

        <!-- COMMENTAIRES -->

        <section class="comments">

            <h2>Commentaires</h2>

            <textarea
                placeholder="Ajouter un commentaire">
            </textarea>

            <button>
                Publier
            </button>

        </section>

    </section>

</main>
<script src="../js/main.js"></script>
</body>
</html>

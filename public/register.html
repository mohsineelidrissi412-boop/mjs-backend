<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nous rejoindre</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
    <div class="logo-section">
        <img src="../images/logo.png" class="logo" alt="Logo">
        <div class="logo-text">
            <span class="title">Maison des Jeunes Alqods</span>
            <span class="subtitle">Benguerir</span>
        </div>
    </div>
    <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="news.html">Actualités</a>
        <a href="events.html">Événements</a>
        <a href="clubs.html">Clubs</a>
        <a href="pass_jeunes.html">Pass Jeunes</a>
        <a href="register.html" class="join-btn">Nous rejoindre</a>
    </div>
</nav>

<!-- ================= FORMULAIRE ================= -->
<div class="register-container">
    <h1>Rejoindre la Maison des Jeunes</h1>
    <div id="success-message" class="success-message">
        Votre demande a été envoyée avec succès. En attente de validation.
    </div>

    <form id="register-form" class="register-form">
        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="reg-lastname" placeholder="Votre nom" required>
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="reg-firstname" placeholder="Votre prénom" required>
        </div>
        <div class="form-group">
            <label>Téléphone</label>
            <input type="tel" id="reg-phone" placeholder="06XXXXXXXX" required>
        </div>
        <div class="form-group">
            <label>Adresse e-mail</label>
            <input type="email" id="reg-email" placeholder="nom@email.com" required>
        </div>

        <!-- ================= TYPE DE COMPTE ================= -->
        <div class="form-section">
            <h2>Type de compte</h2>
            <select id="accountType">
                <option value="member">Membre</option>
                <option value="trainer">Encadrant</option>
                <option value="admin">Administrateur</option>
            </select>
        </div>

        <!-- ================= MOT DE PASSE ================= -->
        <div class="form-section">
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="reg-password" required>
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="reg-confirm" required>
            </div>
        </div>

        <!-- ================= BOUTON ================= -->
        <div class="form-group">
            <button type="submit" class="submit-btn" id="reg-submit">
                Envoyer la demande
            </button>
        </div>
    </form>
</div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nous rejoindre</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo-section">

        <img src="../images/logo.png"
             class="logo"
             alt="Logo">

        <div class="logo-text">

            <span class="title">
                Maison des Jeunes Alqods
            </span>

            <span class="subtitle">
                Benguerir
            </span>

        </div>

    </div>

    <div class="nav-links">

        <a href="index.html">
            Accueil
        </a>

        <a href="news.html">
            Actualités
        </a>

        <a href="events.html">
            Événements
        </a>

        <a href="clubs.html">
            Clubs
        </a>

        <a href="pass_jeunes.html">
            Passe Jeune
        </a>

        <a href="register.html"
           class="join-btn">
            Nous rejoindre
        </a>

    </div>

</nav>

<!-- ================= FORMULAIRE ================= -->

<div class="register-container">

<h1>

Rejoindre la Maison des Jeunes

</h1>

<div
id="success-message"
class="success-message">

Votre demande a été envoyée avec succès.

</div>

<form
id="register-form"
class="register-form">

<div class="form-group">

<label>

Nom

</label>

<input
type="text"
placeholder="Votre nom"
required>

</div>

<div class="form-group">

<label>

Prénom

</label>

<input
type="text"
placeholder="Votre prénom"
required>

</div>

<div class="form-group">

<label>

Âge

</label>

<input
type="number"
min="6"
max="99"
required>

</div>

<div class="form-group">

<label>

Sexe

</label>

<select required>

<option value="">

Sélectionner

</option>

<option>

Masculin

</option>

<option>

Féminin

</option>

</select>

</div>

<div class="form-group">

<label>

Téléphone

</label>

<input
type="tel"
placeholder="06XXXXXXXX"
required>

</div>

<div class="form-group">

<label>

Adresse e-mail

</label>

<input
type="email"
placeholder="nom@email.com"
required>

</div>

<div class="form-group">

<label>

Photo

</label>

<input
type="file"
id="photo"
accept="image/*"
required>

</div>

<img
id="preview"
class="photo-preview">
<!-- ================= CHOIX DES CLUBS ================= -->

<div class="form-group">

    <label class="section-label">

        Sélectionnez le ou les clubs auxquels vous souhaitez adhérer

    </label>

    <div class="clubs-grid">

        <label class="club-card">

            <input
                type="checkbox"
                name="clubs[]"
                value="informatique">

            <img
                src="../images/clubs/informatique.jpg"
                alt="Club Informatique"
                class="club-image">

            <h3>Club Informatique</h3>

            <p>

                Développement Web, Programmation,
                Intelligence Artificielle...

            </p>

        </label>

        <label class="club-card">

            <input
                type="checkbox"
                name="clubs[]"
                value="robotique">

            <img
                src="../images/clubs/robotique.jpg"
                alt="Club Robotique"
                class="club-image">

            <h3>Club Robotique</h3>

            <p>

                Robotique, électronique
                et projets innovants.

            </p>

        </label>

        <label class="club-card">

            <input
                type="checkbox"
                name="clubs[]"
                value="musique">

            <img
                src="../images/clubs/musique.jpg"
                alt="Club Musique"
                class="club-image">

            <h3>Club Musique</h3>

            <p>

                Chant, guitare,
                piano et animation.

            </p>

        </label>

        <label class="club-card">

            <input
                type="checkbox"
                name="clubs[]"
                value="theatre">

            <img
                src="../images/clubs/theatre.jpg"
                alt="Club Théâtre"
                class="club-image">

            <h3>Club Théâtre</h3>

            <p>

                Théâtre,
                expression artistique
                et spectacles.

            </p>

        </label>

        <label class="club-card">

            <input
                type="checkbox"
                name="clubs[]"
                value="sport">

            <img
                src="../images/clubs/sport.jpg"
                alt="Club Sport"
                class="club-image">

            <h3>Club Sport</h3>

            <p>

                Football,
                Basketball,
                Volleyball...

            </p>

        </label>

        <label class="club-card">

            <input
                type="checkbox"
                name="clubs[]"
                value="langues">

            <img
                src="../images/clubs/langues.jpg"
                alt="Club Langues"
                class="club-image">

            <h3>Club Langues</h3>

            <p>

                Français,
                Anglais,
                Espagnol...

            </p>

        </label>

    </div>

</div>
<!-- ================= BOUTON ================= -->

<div class="form-group">

    <button
        type="submit"
        class="submit-btn">

        Envoyer la demande

    </button>

</div>

</form>

</div>

<!-- ================= FOOTER ================= -->

<script src="../js/main.js"></script>

</body>

</html>

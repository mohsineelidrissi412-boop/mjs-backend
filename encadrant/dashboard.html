<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Encadrant - Plateforme de Gestion</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div style="width:40px; height:40px; background:var(--secondary-color); border-radius:8px;"></div>
            <h2>Encadrant</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <i class="fas fa-chart-line"></i> Vue d'ensemble
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fas fa-user-tie"></i> Mon Profil
            </a>
            <a href="announcements.html" class="nav-item">
                <i class="fas fa-bullhorn"></i> Mes Annonces
            </a>
            <a href="events.html" class="nav-item">
                <i class="fas fa-calendar-check"></i> Mes Événements
            </a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
            <h1 class="topbar-title">Vue d'ensemble</h1>
            <div class="topbar-actions">
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Encadrant+User&background=0D9488&color=fff" alt="Encadrant Avatar">
                    <div class="user-info">
                        <p class="name">Prof. Encadrant</p>
                        <p class="role">Encadrant</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="content-area">
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#E0F2FE; color:#0284C7;">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3>2</h3>
                        <p>Clubs Supervisés</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background:#FEF3C7; color:#D97706;">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stat-info">
                        <h3>5</h3>
                        <p>Événements Créés</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background:#DCFCE7; color:#15803D;">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <div class="stat-info">
                        <h3>57</h3>
                        <p>Membres Encadrés</p>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>Aperçu de mes clubs</h2>
                <div style="display:flex; gap:16px; margin-top:20px;">
                    <div style="border:1px solid #E2E8F0; padding:16px; border-radius:12px; flex:1;">
                        <h4 style="margin:0 0 8px 0;">Club Technologie</h4>
                        <p style="margin:0; font-size:14px; color:var(--text-muted);">42 membres actifs</p>
                    </div>
                    <div style="border:1px solid #E2E8F0; padding:16px; border-radius:12px; flex:1;">
                        <h4 style="margin:0 0 8px 0;">Club Robotique</h4>
                        <p style="margin:0; font-size:14px; color:var(--text-muted);">15 membres actifs</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
